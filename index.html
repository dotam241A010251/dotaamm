<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đèn kéo quân</title>
    <style>
        body { margin: 0; height: 100vh; display: flex; justify-content: center; align-items: center; background: #111; perspective: 1000px; }
        .carousel { width: 180px; height: 230px; position: relative; transform-style: preserve-3d; animation: rotate 12s linear infinite; }
        .carousel.paused { animation-play-state: paused; }
        .face { position: absolute; width: 100%; height: 100%; border: 2px solid #fff; border-radius: 8px; overflow: hidden; }
        .face img { width: 100%; height: 100%; object-fit: cover; }
        .face:nth-child(1) { transform: rotateY(0deg) translateZ(240px); }
        .face:nth-child(2) { transform: rotateY(60deg) translateZ(240px); }
        .face:nth-child(3) { transform: rotateY(120deg) translateZ(240px); }
        .face:nth-child(4) { transform: rotateY(180deg) translateZ(240px); }
        .face:nth-child(5) { transform: rotateY(240deg) translateZ(240px); }
        .face:nth-child(6) { transform: rotateY(300deg) translateZ(240px); }
        @keyframes rotate { from { transform: rotateY(0deg); } to { transform: rotateY(-360deg); } }
    </style>
</head>
<body>
    <div class="carousel" id="carousel">
        <div class="face"><img src="img1.jpg" alt="1"></div>
        <div class="face"><img src="img2.jpg" alt="2"></div>
        <div class="face"><img src="img3.jpg" alt="3"></div>
        <div class="face"><img src="img4.jpg" alt="4"></div>
        <div class="face"><img src="img5.jpg" alt="5"></div>
        <div class="face"><img src="img6.jpg" alt="6"></div>
    </div>

    <script>
        const carousel = document.getElementById('carousel');
        document.querySelectorAll('.face').forEach(face => {
            face.onmouseenter = () => carousel.classList.add('paused');
            face.onmouseleave = () => carousel.classList.remove('paused');
        });
    </script>
</body>
</html>
